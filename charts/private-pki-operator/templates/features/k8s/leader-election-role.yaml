---
# permissions for leader election (namespace-scoped, operator namespace only)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: private-pki-operator-leader-election
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: private-pki-operator
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
