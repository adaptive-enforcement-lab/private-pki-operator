# Cluster-side pull credential for the private GHCR package. See the `ghcr`
# block in values.yaml for why a PAT is the only working credential type here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-ghcr-pull
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-ghcr-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .Values.ghcr.username }}","password":"{{ `{{ .token }}` }}","auth":"{{ `{{ printf "%s:%s" "` }}{{ .Values.ghcr.username }}{{ `" .token | b64enc }}` }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.ghcr.pullTokenSecretPath }}
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
