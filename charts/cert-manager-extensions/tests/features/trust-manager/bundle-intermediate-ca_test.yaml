suite: Bundle / private-intermediate-ca
templates:
  - features/trust-manager/bundle-intermediate-ca.yaml
tests:
  - it: renders a Bundle when trust-manager is enabled
    set:
      labels.environment: qac
      pki.trustManager.enabled: true
    asserts:
      - isKind:
          of: Bundle
  - it: has the correct name
    set:
      labels.environment: qac
      pki.trustManager.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: private-intermediate-ca
  - it: sources tls.crt from the private-intermediate-ca Secret
    set:
      labels.environment: qac
      pki.trustManager.enabled: true
    asserts:
      - equal:
          path: spec.sources[0].secret.name
          value: private-intermediate-ca
      - equal:
          path: spec.sources[0].secret.key
          value: tls.crt
  - it: targets all namespaces
    set:
      labels.environment: qac
      pki.trustManager.enabled: true
    asserts:
      - isNull:
          path: spec.target.namespaceSelector.matchLabels
  - it: distributes the cert as ca.crt in a ConfigMap
    set:
      labels.environment: qac
      pki.trustManager.enabled: true
    asserts:
      - equal:
          path: spec.target.configMap.key
          value: ca.crt
  - it: renders no resources when trust-manager is disabled
    set:
      labels.environment: qac
      pki.trustManager.enabled: false
    asserts:
      - hasDocuments:
          count: 0
