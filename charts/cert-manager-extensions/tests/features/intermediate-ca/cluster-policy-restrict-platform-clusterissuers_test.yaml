suite: ClusterPolicy / pki-restrict-platform-clusterissuers
templates:
  - features/intermediate-ca/cluster-policy-restrict-platform-clusterissuers.yaml
tests:
  - it: renders a ClusterPolicy
    set:
      labels.environment: qac
    asserts:
      - isKind:
          of: ClusterPolicy
  - it: has the correct name
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: metadata.name
          value: pki-restrict-platform-clusterissuers
  - it: is in Audit mode
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.validationFailureAction
          value: Audit
  - it: runs background scans
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.background
          value: true
  - it: targets cert-manager Certificate resources only
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].match.any[0].resources.kinds[0]
          value: cert-manager.io/*/Certificate
  - it: excludes the cert-manager namespace
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].match.any[0].resources.namespaceSelector.matchExpressions[0].operator
          value: NotIn
      - contains:
          path: spec.rules[0].match.any[0].resources.namespaceSelector.matchExpressions[0].values
          content: cert-manager
  - it: skips isCA certificates via precondition
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].preconditions.all[0].operator
          value: Equals
      - equal:
          path: spec.rules[0].preconditions.all[0].value
          value: false
  - it: denies when issuerRef.kind is ClusterIssuer
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].validate.deny.conditions.all[0].operator
          value: Equals
      - equal:
          path: spec.rules[0].validate.deny.conditions.all[0].value
          value: ClusterIssuer
  - it: denies both platform ClusterIssuer names
    set:
      labels.environment: qac
    asserts:
      - contains:
          path: spec.rules[0].validate.deny.conditions.all[1].value
          content: private-root-ca
      - contains:
          path: spec.rules[0].validate.deny.conditions.all[1].value
          content: private-intermediate-ca
  # private-root-ca-selfsigned is a namespace Issuer in cert-manager now. This
  # policy only matches Certificates OUTSIDE cert-manager, and a namespace Issuer
  # cannot be referenced across namespaces, so listing it would imply a
  # restriction that no longer means anything.
  - it: does not list the namespace-scoped bootstrap issuer
    set:
      labels.environment: qac
    asserts:
      - notContains:
          path: spec.rules[0].validate.deny.conditions.all[1].value
          content: private-root-ca-selfsigned
  - it: renders no resources when policies disabled
    set:
      labels.environment: qac
      pki.policies.enabled: false
    asserts:
      - hasDocuments:
          count: 0
