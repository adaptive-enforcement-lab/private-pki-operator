suite: Certificate / private-intermediate-ca
templates:
  - features/intermediate-ca/certificate-intermediate-ca.yaml
tests:
  - it: renders a Certificate
    set:
      labels.environment: qac
    asserts:
      - isKind:
          of: Certificate
  - it: has the correct name
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: metadata.name
          value: private-intermediate-ca
  - it: is scoped to the cert-manager namespace
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: metadata.namespace
          value: cert-manager
  - it: is a CA certificate
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.isCA
          value: true
  - it: uses ECDSA P-256 and rotates the private key on renewal
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.privateKey.algorithm
          value: ECDSA
      - equal:
          path: spec.privateKey.size
          value: 256
      - equal:
          path: spec.privateKey.rotationPolicy
          value: Always
  - it: hardcodes the secret name
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.secretName
          value: private-intermediate-ca
  - it: generates commonName from environment (uppercase)
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.commonName
          value: "Private Intermediate CA QAC"
  - it: generates commonName for each environment
    set:
      labels.environment: prd
    asserts:
      - equal:
          path: spec.commonName
          value: "Private Intermediate CA PRD"
  - it: uses the default intermediate CA validity
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.duration
          value: "2160h"
  - it: uses the default intermediate CA renewBefore
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.renewBefore
          value: "168h"
  - it: accepts a custom validity
    set:
      labels.environment: qac
      pki.intermediateCA.validity: "4320h"
    asserts:
      - equal:
          path: spec.duration
          value: "4320h"
  - it: references private-root-ca as the ClusterIssuer
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.issuerRef.name
          value: private-root-ca
      - equal:
          path: spec.issuerRef.kind
          value: ClusterIssuer
      - equal:
          path: spec.issuerRef.group
          value: cert-manager.io
  - it: sets subject organisation to Adaptive Enforcement Lab
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.subject.organizations[0]
          value: "Adaptive Enforcement Lab"
  - it: carries the environment label
    set:
      labels.environment: ops
    asserts:
      - equal:
          path: metadata.labels.environment
          value: ops
