suite: ClusterPolicy / pki-intermediate-ca-max-validity
templates:
  - features/intermediate-ca/cluster-policy-intermediate-ca-max-validity.yaml
tests:
  - it: renders a ClusterPolicy
    set:
      labels.environment: qac
    asserts:
      - isKind:
          of: ClusterPolicy
  - it: has the correct name
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: metadata.name
          value: pki-intermediate-ca-max-validity
  - it: is in Audit mode
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.validationFailureAction
          value: Audit
  - it: runs background scans
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.background
          value: true
  - it: targets cert-manager Certificate resources only
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].match.any[0].resources.kinds[0]
          value: cert-manager.io/*/Certificate
  - it: excludes the cert-manager namespace
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].match.any[0].resources.namespaceSelector.matchExpressions[0].operator
          value: NotIn
      - contains:
          path: spec.rules[0].match.any[0].resources.namespaceSelector.matchExpressions[0].values
          content: cert-manager
  - it: only applies to isCA certificates via precondition
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].preconditions.all[0].operator
          value: Equals
      - equal:
          path: spec.rules[0].preconditions.all[0].value
          value: true
  - it: denies when duration exceeds 2160h
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].validate.deny.conditions.all[0].operator
          value: GreaterThan
      - equal:
          path: spec.rules[0].validate.deny.conditions.all[0].value
          value: 2160
  - it: renders no resources when policies disabled
    set:
      labels.environment: qac
      pki.policies.enabled: false
    asserts:
      - hasDocuments:
          count: 0
