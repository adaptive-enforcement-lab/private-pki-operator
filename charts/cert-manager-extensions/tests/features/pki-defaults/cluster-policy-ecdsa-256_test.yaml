suite: ClusterPolicy / pki-require-ecdsa-256
templates:
  - features/pki-defaults/cluster-policy-ecdsa-256.yaml
tests:
  - it: renders a ClusterPolicy
    set:
      labels.environment: qac
    asserts:
      - isKind:
          of: ClusterPolicy
  - it: has the correct name
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: metadata.name
          value: pki-require-ecdsa-256
  - it: is in Audit mode
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.validationFailureAction
          value: Audit
  - it: runs background scans
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.background
          value: true
  - it: targets cert-manager Certificate resources only
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].match.any[0].resources.kinds[0]
          value: cert-manager.io/*/Certificate
  - it: denies when algorithm is not ECDSA
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].validate.deny.conditions.any[0].operator
          value: NotEquals
      - equal:
          path: spec.rules[0].validate.deny.conditions.any[0].value
          value: ECDSA
  - it: denies when size is not 256 using backtick-quoted numeric fallback
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].validate.deny.conditions.any[1].operator
          value: NotEquals
      - equal:
          path: spec.rules[0].validate.deny.conditions.any[1].value
          value: 256
      - matchRegex:
          path: spec.rules[0].validate.deny.conditions.any[1].key
          pattern: '\|\|\s*`0`'
  - it: renders no resources when policies disabled
    set:
      labels.environment: qac
      pki.policies.enabled: false
    asserts:
      - hasDocuments:
          count: 0
