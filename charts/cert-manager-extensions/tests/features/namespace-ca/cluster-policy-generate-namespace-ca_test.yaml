suite: ClusterPolicy / generate-namespace-intermediate-ca
templates:
  - features/namespace-ca/cluster-policy-generate-namespace-ca.yaml
tests:
  - it: renders a ClusterPolicy
    set:
      labels.environment: qac
    asserts:
      - isKind:
          of: ClusterPolicy
  - it: has the correct name
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: metadata.name
          value: generate-namespace-intermediate-ca
  - it: backfills existing labeled namespaces
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.generateExisting
          value: true
  - it: matches on the configured namespace label
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].match.any[0].resources.kinds[0]
          value: Namespace
      - equal:
          path: spec.rules[0].match.any[0].resources.selector.matchLabels["pki-managed"]
          value: "true"
  - it: matches on a custom namespace label when overridden
    set:
      labels.environment: qac
      pki.namespaceCA.label: acme.io/custom-pki
    asserts:
      - equal:
          path: spec.rules[0].match.any[0].resources.selector.matchLabels["acme.io/custom-pki"]
          value: "true"
  - it: generates the Certificate with synchronize (drift-corrected, sole owner post-migration)
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].generate.synchronize
          value: true
      - equal:
          path: spec.rules[0].generate.apiVersion
          value: cert-manager.io/v1
      - equal:
          path: spec.rules[0].generate.kind
          value: Certificate
      - equal:
          path: spec.rules[0].generate.name
          value: "{{request.object.metadata.name}}-intermediate-ca"
      - equal:
          path: spec.rules[0].generate.namespace
          value: "{{request.object.metadata.name}}"
  - it: generated Certificate is a namespace-scoped CA off the cluster intermediate
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].generate.data.spec.isCA
          value: true
      - equal:
          path: spec.rules[0].generate.data.spec.issuerRef.name
          value: private-intermediate-ca
      - equal:
          path: spec.rules[0].generate.data.spec.issuerRef.kind
          value: ClusterIssuer
  - it: generated Certificate's subject follows the #239 CN/O/OU standard, CN within the 64-byte X.509 limit
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[0].generate.data.spec.commonName
          value: "{{request.object.metadata.name}} Intermediate CA QAC"
      - equal:
          path: spec.rules[0].generate.data.spec.subject.organizations[0]
          value: "Adaptive Enforcement Lab"
      - equal:
          path: spec.rules[0].generate.data.spec.subject.organizationalUnits[0]
          value: "{{request.object.metadata.name}}"
  - it: commonName's environment segment follows labels.environment, not hardcoded
    set:
      labels.environment: prd
    asserts:
      - equal:
          path: spec.rules[0].generate.data.spec.commonName
          value: "{{request.object.metadata.name}} Intermediate CA PRD"
  - it: uses the configured validity and renewBefore
    set:
      labels.environment: qac
      pki.namespaceCA.validity: "720h"
      pki.namespaceCA.renewBefore: "72h"
    asserts:
      - equal:
          path: spec.rules[0].generate.data.spec.duration
          value: "720h"
      - equal:
          path: spec.rules[0].generate.data.spec.renewBefore
          value: "72h"
  - it: generates the Issuer backed by the generated Certificate's secret
    set:
      labels.environment: qac
    asserts:
      - equal:
          path: spec.rules[1].generate.apiVersion
          value: cert-manager.io/v1
      - equal:
          path: spec.rules[1].generate.kind
          value: Issuer
      - equal:
          path: spec.rules[1].generate.name
          value: "{{request.object.metadata.name}}-ca"
      - equal:
          path: spec.rules[1].generate.data.spec.ca.secretName
          value: "{{request.object.metadata.name}}-intermediate-ca"
