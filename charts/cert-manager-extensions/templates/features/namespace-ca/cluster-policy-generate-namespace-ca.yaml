---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-namespace-intermediate-ca
  labels:
    {{- include "cert-manager-extensions.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Generate Namespace Intermediate CA
    policies.kyverno.io/category: PKI
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace, Certificate, Issuer
    policies.kyverno.io/description: >-
      Generates Certificate/<namespace>-intermediate-ca + Issuer/<namespace>-ca for any
      namespace labeled {{ .Values.pki.namespaceCA.label }}: "true", centralizing
      namespace-scoped intermediate CA issuance instead of each consumer hand-rolling its
      own (pki-platform#328/#351). Never creates over an existing Certificate/Issuer of the
      same name -- a namespace that already hand-rolls its own is left untouched until its
      own repo migrates (pki-platform#351's Subtasks).
spec:
  # Backfills namespaces that already carry the label when this policy is first applied.
  # Without it the rule fires only on Namespace create/update/label-change, and every
  # already-PKI-managed namespace predates this policy.
  generateExisting: true
  rules:
    - name: generate-namespace-intermediate-ca-certificate
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  {{ .Values.pki.namespaceCA.label }}: "true"
      generate:
        # true post-migration: this policy is now sole owner of every object it names
        # (the 4 hand-rolled duplicates are dropped). Trade-off: unlabeling a namespace
        # now deletes its CA too — see design doc "Opt-out semantics".
        synchronize: true
        apiVersion: cert-manager.io/v1
        kind: Certificate
        name: "{{ `{{request.object.metadata.name}}` }}-intermediate-ca"
        namespace: "{{ `{{request.object.metadata.name}}` }}"
        data:
          metadata:
            labels:
              {{- include "cert-manager-extensions.labels" . | nindent 14 }}
            annotations:
              description: >-
                Namespace-scoped intermediate CA, generated by pki-platform's
                generate-namespace-intermediate-ca ClusterPolicy (pki-platform#351) off the
                {{ .Values.pki.namespaceCA.label }} label. Backs Issuer/<namespace>-ca.
          spec:
            isCA: true
            # #239 CN grammar, minus the redundant "Namespace" word that pushed
            # performance-testing over X.509's 64-byte CN limit.
            commonName: {{ printf "%s Intermediate CA %s" `{{request.object.metadata.name}}` (.Values.labels.environment | upper) | quote }}
            subject:
              organizations:
                - "Adaptive Enforcement Lab"
              organizationalUnits:
                - "{{ `{{request.object.metadata.name}}` }}"
            secretName: "{{ `{{request.object.metadata.name}}` }}-intermediate-ca"
            duration: {{ .Values.pki.namespaceCA.validity | quote }}
            renewBefore: {{ .Values.pki.namespaceCA.renewBefore | quote }}
            privateKey:
              algorithm: ECDSA
              size: 256
              rotationPolicy: Always
            issuerRef:
              name: private-intermediate-ca
              kind: ClusterIssuer
              group: cert-manager.io
    - name: generate-namespace-ca-issuer
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  {{ .Values.pki.namespaceCA.label }}: "true"
      generate:
        synchronize: true
        apiVersion: cert-manager.io/v1
        kind: Issuer
        name: "{{ `{{request.object.metadata.name}}` }}-ca"
        namespace: "{{ `{{request.object.metadata.name}}` }}"
        data:
          metadata:
            labels:
              {{- include "cert-manager-extensions.labels" . | nindent 14 }}
            annotations:
              description: >-
                Namespace-scoped issuer backed by Certificate/<namespace>-intermediate-ca,
                generated by pki-platform's generate-namespace-intermediate-ca ClusterPolicy
                (pki-platform#351). Consumers in this namespace issue leaf certs against
                this Issuer, not against the cluster ClusterIssuer directly.
          spec:
            ca:
              secretName: "{{ `{{request.object.metadata.name}}` }}-intermediate-ca"
