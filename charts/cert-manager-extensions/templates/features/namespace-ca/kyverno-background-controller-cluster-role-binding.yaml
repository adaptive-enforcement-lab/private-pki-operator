---
# ClusterRoleBinding: Kyverno Background Controller namespace-CA generation access
#
# Binds the ClusterRole declared in kyverno-background-controller-cluster-role.yaml,
# which carries the rationale.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-background-controller:generate-namespace-intermediate-ca
  labels:
    {{- include "cert-manager-extensions.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-background-controller:generate-namespace-intermediate-ca
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
