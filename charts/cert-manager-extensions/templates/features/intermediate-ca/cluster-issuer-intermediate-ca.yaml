---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: private-intermediate-ca
  labels:
    {{- include "cert-manager-extensions.labels" . | nindent 4 }}
  annotations:
    description: "Per-environment private intermediate CA issuer. Consumers reference this to sign their namespace-scoped intermediate CA Certificates (isCA: true). Do not reference directly in leaf Certificate resources — use your namespace Issuer instead."
spec:
  ca:
    secretName: "private-intermediate-ca"
